# CI — Wywy-Docs
#
# Runs tests inside an official uv container image.  test.sh runs the
# bare-metal pytest path inside the job container; uv and Python 3.12 come
# from the image, so the self-hosted runners need no uv provisioning.

name: Wywy-Docs CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: [self-hosted, wywy, dind]
    container:
      image: ghcr.io/astral-sh/uv:python3.12-trixie-slim
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: ./test.sh
