# CI — Wywy-Docs
#
# Runs tests inside the Docker image (./test.sh --docker).  The default
# bare-metal mode of test.sh is for local hosts; CI uses Docker until the
# self-hosted runners are provisioned with uv/bats/python.
#
# TODO: update runs-on tags when self-hosted runners are deployed.
#   Default: runs-on: ubuntu-latest
#   Self-hosted: runs-on: [self-hosted, wywy]

name: Wywy-Docs CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: [self-hosted, wywy, dind]
    steps:
      - uses: actions/checkout@v4

      - name: Run tests (Docker)
        run: ./test.sh --docker
