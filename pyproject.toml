[project]
name = "wywy-docs"
version = "0.1.0"
description = "Wywy-Docs RAG — MCP documentation search server"
requires-python = ">=3.10"
dependencies = [
    "mcp",
    "pydantic>=2.0",
    "pyright>=1.1.411",
    "pyyaml",
    "uvicorn",
]

[tool.pyright]
typeCheckingMode = "strict"
include = ["src", "tests"]
pythonVersion = "3.12"
useLibraryCodeForTypes = true

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["wywy_docs*"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta:__legacy__"

[dependency-groups]
dev = [
    "pre-commit",
    "pytest>=9.1.1",
]
