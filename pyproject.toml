[project]
name = "wywy-docs"
version = "0.1.0"
description = "Wywy-Docs RAG — MCP documentation search server"
requires-python = ">=3.10"
dependencies = [
    "mcp",
    "mypy>=2.3.0",
    "pydantic>=2.0",
    "pyyaml",
    "uvicorn",
]

[project.scripts]
wywy-docs-serve = "wywy_docs.server:main"
wywy-docs-install = "wywy_docs.install:main"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
# Resolve wywy_docs from src/ even when mypy is invoked with test files
# only (staged hook), avoiding the editable install lacking py.typed.
mypy_path = "src"

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests deliberately keep some imports inside functions (importability
# checks, avoiding import-time MCP wiring) and reach into private members
# (module globals shared with tests).
"tests/**" = ["S101", "PLC0415", "SLF001"]
# install.py deliberately prints user-facing steps; a print() call is the
# whole point of the command.
"src/wywy_docs/install.py" = ["T201"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["wywy_docs*"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta:__legacy__"

[dependency-groups]
dev = [
    "pre-commit",
    "pytest>=9.1.1",
    "types-PyYAML",
]
