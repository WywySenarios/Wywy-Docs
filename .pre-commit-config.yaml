default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      # --- staged (pre-commit) ---
      - id: betterleaks
        name: betterleaks (staged)
        entry: betterleaks git . --staged --redact --no-banner
        language: system
        pass_filenames: false
      - id: ruff-check
        name: ruff check (staged)
        entry: uv run ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format (staged)
        entry: uv run ruff format --check
        language: system
        types: [python]
      - id: prettier
        name: prettier (staged)
        entry: npx --yes prettier@3.5.3 --check
        language: system
        types_or: [mdx, markdown, yaml, json]
      - id: mypy
        name: mypy (staged)
        entry: uv run mypy --follow-imports=silent
        language: system
        types: [python]
        require_serial: true

      # --- full tree (pre-push) ---
      - id: betterleaks-full
        name: betterleaks (full history)
        entry: betterleaks git . --redact --no-banner --verbose
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: ruff-check-full
        name: ruff check (full tree)
        entry: uv run ruff check
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: ruff-format-full
        name: ruff format (full tree)
        entry: uv run ruff format --check
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: prettier-full
        name: prettier (full tree)
        entry: npx --yes prettier@3.5.3 --check "docs/**/*.mdx" "internal/**/*.mdx" "**/*.md" "**/*.yaml" "**/*.yml" "**/*.json"
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: mypy-full
        name: mypy (full tree)
        entry: uv run mypy src tests
        language: system
        pass_filenames: false
        stages: [pre-push]
